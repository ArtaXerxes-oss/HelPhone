name: Maintainer Key Verification

# Closes #619 — validates OpenPGP signatures on commits, tags and pinned
# dependency maintainer keys against live key revocation data from
# keys.openpgp.org + keyserver.ubuntu.com, and evaluates web-of-trust
# certifications (config/maintainer-keys.json).
#
# The nightly run is the important one: a key revoked as COMPROMISED after a
# release invalidates every signature it made, so every release tag is
# re-checked against a freshly refreshed revocation list.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 3 * * *" # nightly KRL refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Validated public keys are cached between runs; entries older than
      # cacheTtlHours are refetched, and --refresh (nightly) forces a refetch.
      - uses: actions/cache@v4
        with:
          path: .cache/maintainer-keys
          key: maintainer-keys-${{ github.run_id }}
          restore-keys: maintainer-keys-

      - name: Pull request commits
        if: github.event_name == 'pull_request'
        run: node scripts/security/verify_maintainer_keys.js --pinned --range "origin/${{ github.base_ref }}..HEAD"

      - name: Pushed commits
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: node scripts/security/verify_maintainer_keys.js --pinned --range HEAD --max 50

      - name: Release tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          STRICT=""
          if [ "${{ vars.REQUIRE_SIGNED_RELEASES }}" = "true" ]; then STRICT="--strict"; fi
          node scripts/security/verify_maintainer_keys.js --pinned --refresh --tags "${{ github.ref_name }}" $STRICT

      - name: Nightly revocation sweep (all release tags + pinned keys)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/security/verify_maintainer_keys.js --pinned --refresh --tags "v*" --range HEAD --max 100
