name: Chaos rehearsal (staging only)

on:
  schedule:
    # Weekly, Mondays 03:00 UTC — off-peak for a community dispatch service.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-staging
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Multi-fault bulkhead rehearsal
    runs-on: ubuntu-latest
    # Only the protected staging environment may run fault injection. There is
    # no production job and no production URL is ever passed to the script.
    environment: staging
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Refuse to run against production
        run: |
          if [ -n "${{ vars.PRODUCTION_URL }}" ] && [ "${{ vars.PRODUCTION_URL }}" = "${{ vars.STAGING_URL }}" ]; then
            echo "Staging and production URLs are identical — refusing chaos run."
            exit 1
          fi

      - name: Run three multi-fault scenarios
        env:
          CHAOS_TARGET_URL: ${{ vars.STAGING_URL }}
          CHAOS_ENABLED: 'true'
          CHAOS_BREAK_GLASS: ${{ secrets.CHAOS_BREAK_GLASS }}
        run: node scripts/chaos-run.js

      - name: Upload rehearsal record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-rehearsal-results
          path: artifacts/chaos-run-results.md
          if-no-files-found: warn
