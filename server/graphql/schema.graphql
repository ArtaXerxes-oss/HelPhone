# Canonical GraphQL contract for the dispatch/events/sync domain.
# This file is versioned and compared against swagger.json + the zod schemas by
# scripts/detect-api-drift.js. Field names, nullability, enums, and pagination
# cursors deliberately mirror the REST surface.

scalar JSON

enum IncidentStatus {
  open
  assigned
  acknowledged
  resolved
}

enum Priority {
  low
  normal
  high
  critical
}

enum ResponderStatus {
  assigned
  en_route
  on_scene
  offline
}

type Location {
  lat: Float!
  lng: Float!
}

type Event {
  id: ID!
  incidentId: ID!
  responderId: ID
  type: String!
  at: String!
  cursor: String!
  payload: JSON
}

type Responder {
  id: ID!
  incidentId: ID!
  name: String!
  status: ResponderStatus!
  location: Location!
  lastEvent: Event
}

type Incident {
  id: ID!
  status: IncidentStatus!
  priority: Priority!
  createdAt: String!
  version: Int!
  location: Location!
  responders: [Responder!]!
  events: [Event!]!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type IncidentEdge {
  node: Incident!
  cursor: String!
}

type IncidentConnection {
  edges: [IncidentEdge!]!
  pageInfo: PageInfo!
}

type EventEdge {
  node: Event!
  cursor: String!
}

type EventConnection {
  edges: [EventEdge!]!
  pageInfo: PageInfo!
}

type SyncSuccess {
  ok: Boolean!
  serverVersion: Int!
  incident: Incident!
}

type SyncConflict {
  conflict: Boolean!
  serverVersion: Int!
  mergeProposal: JSON!
}

type ValidationIssue {
  path: String!
  message: String!
}

type ValidationError {
  error: String!
  issues: [ValidationIssue!]!
}

union SyncFlushResult = SyncSuccess | SyncConflict | ValidationError
union AssignResult = SyncSuccess | SyncConflict | ValidationError

input SyncFlushInput {
  incidentId: ID!
  baseVersion: Int!
  patch: JSON!
}

input AssignResponderInput {
  incidentId: ID!
  responderId: ID!
  expectedVersion: Int
}

type Query {
  incident(id: ID!): Incident
  incidents(limit: Int = 20, cursor: String): IncidentConnection!
  events(incidentId: ID!, limit: Int = 20, cursor: String): EventConnection!
}

type Mutation {
  assignResponder(input: AssignResponderInput!): AssignResult!
  syncFlush(input: SyncFlushInput!): SyncFlushResult!
}
